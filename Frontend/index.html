<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary SEO ─────────────────────────────────────────── -->
    <title>SkillForge AI — AI-Powered Interview Platform for Smarter Hiring</title>
    <meta name="description" content="SkillForge AI is an AI-powered interview platform that automates developer hiring with live video interviews, AI question generation, code evaluation, malpractice detection, and detailed PDF reports. Hire smarter, faster." />
    <meta name="keywords" content="AI interview platform, AI hiring tool, automated developer interviews, technical interview software, AI code evaluation, video interview platform, HR interview automation, developer assessment tool, AI malpractice detection, SkillForge AI" />
    <meta name="author" content="SkillForge AI" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://skillforge-ai.com/" />

    <!-- ─── Open Graph (Facebook, LinkedIn, WhatsApp) ───────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkillForge AI" />
    <meta property="og:title" content="SkillForge AI — AI-Powered Interview Platform for Smarter Hiring" />
    <meta property="og:description" content="Automate your developer hiring with AI-powered live interviews, code evaluation, resume parsing, and detailed PDF reports. Hire smarter with SkillForge AI." />
    <meta property="og:url" content="https://skillforge-ai.com/" />
    <meta property="og:image" content="https://skillforge-ai.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── Twitter Card ────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SkillForge AI — AI-Powered Interview Platform" />
    <meta name="twitter:description" content="Automate developer interviews with AI question generation, live code evaluation, malpractice detection, and detailed reports." />
    <meta name="twitter:image" content="https://skillforge-ai.com/og-image.png" />

    <!-- ─── Favicon & Theme ─────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#2563eb" />

    <!-- ─── Preconnect for Performance ──────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.skillforge-ai.com" />

    <!-- ─── JSON-LD Structured Data ─────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SkillForge AI",
      "url": "https://skillforge-ai.com",
      "description": "AI-powered interview platform that automates developer hiring with live video interviews, AI question generation, code evaluation, malpractice detection, and detailed PDF reports.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free plan available"
      },
      "author": {
        "@type": "Organization",
        "name": "SkillForge AI",
        "url": "https://skillforge-ai.com",
        "logo": "https://skillforge-ai.com/favicon.svg",
        "sameAs": []
      },
      "featureList": [
        "AI-powered interview question generation",
        "Live video interviews with screen sharing",
        "Real-time AI malpractice detection",
        "In-browser Monaco code editor",
        "Automated code evaluation",
        "Resume parsing and analysis",
        "Detailed PDF interview reports",
        "AI hire/reject recommendations"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SkillForge AI",
      "url": "https://skillforge-ai.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://skillforge-ai.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ─── Noscript fallback for crawlers ──────────────────────── -->
    <noscript>
      <meta http-equiv="refresh" content="0;url=https://skillforge-ai.com/" />
    </noscript>
  </head>
  <body>
    <!-- SEO: Visible text for crawlers before React hydration -->
    <div id="root">
      <h1 style="position:absolute;left:-9999px">SkillForge AI — AI-Powered Interview Platform for Smarter Hiring</h1>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
